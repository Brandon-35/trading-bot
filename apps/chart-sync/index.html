    <style>

      /* Auto-fit Grid Layout */
      .auto-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));

      }
      
      @media (max-width: 640px) {
        .auto-grid {
          grid-template-columns: 1fr;
        }
      }

# Paper arena: one service per model, started only for the keys you have, e.g.
#   docker compose --profile gpt --profile claude up -d --build
# Live (real money): docker compose --profile live up -d --build   (needs BINANCE_* and LIVE_CONFIRM in .env)
x-bot: &bot
  build: .
  image: trading-bot:latest
  restart: unless-stopped
  # no env_file: each service gets only its own LLM key (interpolated from .env by compose)
  environment: &env
    MODE: paper
    TZ: Asia/Ho_Chi_Minh
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  volumes:
    - data:/data
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  arena-gpt:
    <<: *bot
    profiles: [gpt]
    environment:
      <<: *env
      BOT_NAME: gpt-6-luna
      DB_PATH: /data/gpt.db
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-6-luna
      LLM_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PRICE_IN: "0.10"
      LLM_PRICE_OUT: "0.50"
  arena-claude:
    <<: *bot
    profiles: [claude]
    environment:
      <<: *env
      BOT_NAME: claude-haiku-5-5
      DB_PATH: /data/claude.db
      LLM_BASE_URL: https://api.anthropic.com/v1/
      LLM_MODEL: claude-haiku-5-5
      LLM_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PRICE_IN: "0.10"
      LLM_PRICE_OUT: "0.50"
  arena-glm:
    <<: *bot
    profiles: [glm]
    environment:
      <<: *env
      BOT_NAME: glm-5.3-flash
      DB_PATH: /data/glm.db
      LLM_BASE_URL: https://api.z.ai/api/paas/v4
      LLM_MODEL: glm-5.3-flash
      LLM_API_KEY: ${ZAI_API_KEY:-}
      LLM_SCHEMA: json_object
      LLM_PRICE_IN: "0.15"
      LLM_PRICE_OUT: "0.50"
  arena-kimi:
    <<: *bot
    profiles: [kimi]
    environment:
      <<: *env
      BOT_NAME: kimi-k3.1-pro
      DB_PATH: /data/kimi.db
      LLM_BASE_URL: https://api.moonshot.ai/v1
      LLM_MODEL: kimi-k3.1-pro
      LLM_API_KEY: ${MOONSHOT_API_KEY:-}
      LLM_SCHEMA: json_object
      LLM_PRICE_IN: "2.00"
      LLM_PRICE_OUT: "10.00"
  live:
    <<: *bot
    profiles: [live]
    environment:
      <<: *env
      MODE: live
      LIVE_CONFIRM: ${LIVE_CONFIRM:-}
      FLOOR_EQUITY: ${FLOOR_EQUITY:-70}   # full stop below this equity (USDT)
      RISK_PCT: ${LIVE_RISK_PCT:-0.02}    # own name: RISK_PCT in .env would also reach the paper arms
      LEVERAGE: ${LIVE_LEVERAGE:-5}
      DAILY_STOP_PCT: ${LIVE_DAILY_STOP_PCT:-0.06}
      SYMBOLS: ${SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT}
      BOT_NAME: live
      BOT_START: ${BOT_START:-2026-11-27T06:25:00Z}   # bot fills before this are the owner's
      START_FUTURES: ${START_FUTURES:-18.7392}
      LLM_CREDIT: ${LLM_CREDIT:-2.0}
      LLM_USAGE_BASELINE: ${LLM_USAGE_BASELINE:-0.00267}
      DB_PATH: /data/live.db
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      # the first LLM key that is set is used (order in trader/llm.py PROVIDERS)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      OPENROUTER_PRICE_IN: ${OPENROUTER_PRICE_IN:-0.10}
      OPENROUTER_PRICE_OUT: ${OPENROUTER_PRICE_OUT:-0.50}
  # v2 paper arms (no Binance keys: public data only). docker compose --profile paper2 up -d --build
  paper-signal:
    <<: *bot
    profiles: [paper2]
    environment:
      <<: *env
      BOT_NAME: paper-signal
      STRATEGY: v2
      ARM: signal
      DB_PATH: /data/paper_signal.db
      PAPER_START: ${PAPER_START:-18.7392}
      FLOOR_EQUITY: ${FLOOR_EQUITY_PAPER:-12}
      RISK_PCT: ${RISK_PCT:-0.02}
      RISK_PCT_PROVEN: ${RISK_PCT_PROVEN:-0.03}
      SIGNAL: ${SIGNAL:-pullback}   # backtest 2026-11-27: 4h pullback +0.127R/trade after fees on 30 alts (720 d)
      UNIVERSE_N: ${UNIVERSE_N:-30}
  paper-committee:
    <<: *bot
    profiles: [paper2]
    environment:
      <<: *env
      BOT_NAME: paper-committee
      STRATEGY: v2
      ARM: committee
      DB_PATH: /data/paper_committee.db
      PAPER_START: ${PAPER_START:-18.7392}
      FLOOR_EQUITY: ${FLOOR_EQUITY_PAPER:-12}
      RISK_PCT: ${RISK_PCT:-0.02}
      RISK_PCT_PROVEN: ${RISK_PCT_PROVEN:-0.03}
      SIGNAL: ${SIGNAL:-pullback}   # backtest 2026-11-27: 4h pullback +0.127R/trade after fees on 30 alts (720 d)
      UNIVERSE_N: ${UNIVERSE_N:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      OPENROUTER_PRICE_IN: ${OPENROUTER_PRICE_IN:-0.10}
      OPENROUTER_PRICE_OUT: ${OPENROUTER_PRICE_OUT:-0.50}
      LLM_DAILY_USD: ${LLM_DAILY_USD:-0.10}
  dashboard:   # read-only status page at https://trade.brandondev.online (edge Caddy), login form + signed session cookie in the app
    image: trading-bot:latest
    build: .
    restart: unless-stopped
    command: ["python", "-m", "trader.dashboard"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      DASH_USER: ${DASH_USER:-brandon}
      DASH_PASSWORD: ${DASH_PASSWORD:-}
      BOT_START: ${BOT_START:-2026-11-27T06:25:00Z}   # bot fills before this are the owner's
      START_FUTURES: ${START_FUTURES:-18.7392}
      LLM_CREDIT: ${LLM_CREDIT:-2.0}
      LLM_USAGE_BASELINE: ${LLM_USAGE_BASELINE:-0.00267}
      SYMBOLS: ${SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT}
    ports: ["127.0.0.1:8090:8080"]
    networks: [default, edge]
    volumes:
      - data:/data

networks:
  edge:
    external: true

volumes:
  data:

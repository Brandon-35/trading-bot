# Paper arena: 4 models, same rules, separate databases. Live/demo: see README "Go live".
x-bot: &bot
  build: .
  image: trading-bot:latest
  restart: unless-stopped
  env_file: .env
  environment: &env
    MODE: paper
    TZ: Asia/Ho_Chi_Minh
  volumes:
    - ./data:/data
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  arena-gpt:
    <<: *bot
    environment:
      <<: *env
      BOT_NAME: gpt-6-luna
      DB_PATH: /data/gpt.db
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-6-luna
      LLM_API_KEY: ${OPENAI_API_KEY:?}
      LLM_PRICE_IN: "0.10"
      LLM_PRICE_OUT: "0.50"
  arena-claude:
    <<: *bot
    environment:
      <<: *env
      BOT_NAME: claude-haiku-5-5
      DB_PATH: /data/claude.db
      LLM_BASE_URL: https://api.anthropic.com/v1/
      LLM_MODEL: claude-haiku-5-5
      LLM_API_KEY: ${ANTHROPIC_API_KEY:?}
      LLM_PRICE_IN: "0.10"
      LLM_PRICE_OUT: "0.50"
  arena-glm:
    <<: *bot
    environment:
      <<: *env
      BOT_NAME: glm-5.3-flash
      DB_PATH: /data/glm.db
      LLM_BASE_URL: https://api.z.ai/api/paas/v4
      LLM_MODEL: glm-5.3-flash
      LLM_API_KEY: ${ZAI_API_KEY:?}
      LLM_SCHEMA: json_object
      LLM_PRICE_IN: "0.15"
      LLM_PRICE_OUT: "0.50"
  arena-kimi:
    <<: *bot
    environment:
      <<: *env
      BOT_NAME: kimi-k3.1-pro
      DB_PATH: /data/kimi.db
      LLM_BASE_URL: https://api.moonshot.ai/v1
      LLM_MODEL: kimi-k3.1-pro
      LLM_API_KEY: ${MOONSHOT_API_KEY:?}
      LLM_SCHEMA: json_object
      LLM_PRICE_IN: "2.00"
      LLM_PRICE_OUT: "10.00"
